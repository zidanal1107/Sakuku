name: sakuku

services:
  # 🗄️ DATABASE SERVICE (MariaDB)
  sakuku-db:
    image: mariadb:11
    container_name: sakuku-mariadb
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: zidanganteng
      MARIADB_DATABASE: expense_tracker
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # 🚂 BACKEND SERVICE
  sakuku-backend:
    build:
      context: ./backend
      network: host
      dns:
        - 8.8.8.8
        - 1.1.1.1
    dns:
      - 8.8.8.8
      - 1.1.1.1
    container_name: sakuku-express
    restart: always
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: "mysql://root:zidanganteng@sakuku-db:3306/expense_tracker"
      PORT: 5000
      FRONTEND_URL: "http://localhost:5173"
    depends_on:
      sakuku-db:
        condition: service_healthy

  # 🎨 FRONTEND SERVICE
  sakuku-frontend:
    build:
      context: ./frontend
      dns:
        - 8.8.8.8
        - 1.1.1.1
    dns:
      - 8.8.8.8
      - 1.1.1.1
    container_name: sakuku-react
    restart: always
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: "http://localhost:5000/api"
    depends_on:
      sakuku-backend:
        condition: service_started

volumes:
  mariadb_data:
